name: Build Multi-Platform Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install PyQt6 cryptography nuitka zstandard ordered-set
      - name: Build Windows x64 and x86 packages
        run: |
          python build_zip.py --assets
          python -m nuitka --onefile --standalone --enable-plugin=pyqt6 --windows-console-mode=disable --windows-uac-admin --windows-icon-from-ico=app_icon.ico --include-data-files=embedded_assets.zip=embedded_assets.zip --output-filename=Unfit-Zapret.exe zapret_manager.py
          python build_zip.py --win-x86 --out-dir dist_win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            Unfit-Zapret.exe
            dist_win/Unfit-Zapret-win-x86.zip

  build-linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Linux tarballs for all architectures
        run: |
          python build_zip.py --linux-all --out-dir dist_linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist_linux/*.tar.gz

  publish-release:
    needs: [build-windows, build-linux-packages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-packages/*
            artifacts/linux-packages/*.tar.gz
